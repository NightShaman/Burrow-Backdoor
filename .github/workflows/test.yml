name: Runtime contracts

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BURROW_CORE_ROOT: ${{ github.workspace }}/.core/Burrow-Backend
    steps:
      - uses: actions/checkout@v4
      - name: Checkout required Core integration target
        uses: actions/checkout@v4
        with:
          repository: NightShaman/Burrow-Backend
          ref: main
          path: .core/Burrow-Backend
          token: ${{ secrets.BURROW_CORE_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Core integration dependencies
        working-directory: .core/Burrow-Backend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
