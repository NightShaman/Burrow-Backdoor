name: Release Burrow Backdoor

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: burrow-backdoor-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Assign calendar version
        id: version
        run: |
          set -eu
          base=$(date -u +%Y.%m.%d)
          version=$base
          suffix=0
          while git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; do
            suffix=$((suffix + 1))
            version="$base.$suffix"
          done
          node scripts/set-release-version.mjs "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Verify release
        run: |
          set -eu
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          node scripts/set-release-version.mjs "${{ steps.version.outputs.version }}" --check
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          tag="v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add burrow.mod.json package.json package-lock.json
          git diff --cached --quiet || git commit -m "Release Burrow Backdoor $VERSION"
          git push origin HEAD:main
          git tag "$tag"
          git push origin "$tag"
          gh release create "$tag" \
            --title "Burrow Backdoor $VERSION" \
            --notes "Calendar-versioned Burrow Backdoor release $VERSION from source $(git rev-parse HEAD)."
