name: Container

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Image identity
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: burrow-backdoor:verify
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Burrow Backdoor
            org.opencontainers.image.description=Read-only diagnostic MCP server for Burrow
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker logs backdoor-smoke; docker rm -f backdoor-smoke' EXIT
          docker run -d --name backdoor-smoke -p 127.0.0.1:8080:8080 \
            -e BURROW_BASE_URL=http://127.0.0.1:42817 \
            -e BURROW_API_TOKEN=ci-placeholder-not-a-secret burrow-backdoor:verify
          curl --fail --retry 15 --retry-all-errors --retry-delay 2 --max-time 5 --retry-max-time 60 http://127.0.0.1:8080/healthz
      - name: Publish verified image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          set -eu
          for tag in latest "$VERSION" "sha-$GITHUB_SHA"; do
            docker tag burrow-backdoor:verify "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
