site_name: Burrow Backdoor
site_description: Diagnose and administer the home Burrow with Core-owned agent access
site_url: https://bbd-docs.blissful-psychosis.com/
repo_url: https://github.com/GoblinKing-Burrow/Burrow-Backdoor
repo_name: GoblinKing-Burrow/Burrow-Backdoor
edit_uri: ""
strict: true

theme:
  name: material
  language: en
  logo: assets/hero.png
  favicon: assets/hero.png
  font: false
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn
extra_css:
  - assets/stylesheets/extra.css

nav:
  - Home: index.md
  - Get started:
      - Install and enable: installation.md
      - Agent access: access.md
      - Diagnose your Burrow: diagnostics.md
  - Administration:
      - Manage mods: administration.md
      - Operations and recovery: operations.md
      - Troubleshooting: troubleshooting.md
  - Reference:
      - Security and trust: security.md
      - Tool reference: tools.md
      - Operator API: operator-api.md
      - Sources and development: sources.md
